name: Apply replica topology
on:
  workflow_call:
    inputs:
      environment: {type: string, required: true}
      terraform-root: {type: string, required: true}
      desired-replica-count: {type: number, required: true}
      expected-current-count: {type: number, required: true}
      expected-state-fingerprint: {type: string, required: true}
permissions: {contents: read, id-token: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'production' && 'production-infrastructure' || 'staging' }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3.1.2
        with: {terraform_version: 1.16.1, terraform_wrapper: false}
      - name: Fetch infrastructure secrets
        uses: Infisical/secrets-action@v1.0.17
        with: {method: oidc, identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972, project-slug: lo-resuelvo-7j-te, env-slug: "${{ inputs.environment }}", secret-path: /infrastructure, include-imports: false, recursive: false}
      - name: Initialize Terraform
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TERRAFORM_ROOT: ${{ inputs.terraform-root }}
        run: |
          echo "::add-mask::$TF_PRIMARY_INSTANCE_NAME"
          echo "::add-mask::$TF_PRIMARY_INSTANCE_IPV4"
          echo "::add-mask::$TF_PUBLIC_NETWORK_ID"
          {
            echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY"
            echo "AWS_ENDPOINT_URL_S3=$R2_ENDPOINT"
            echo "TF_VAR_primary_instance={\"name\":\"$TF_PRIMARY_INSTANCE_NAME\",\"ipv4\":\"$TF_PRIMARY_INSTANCE_IPV4\"}"
            echo "TF_VAR_public_network_id=$TF_PUBLIC_NETWORK_ID"
            echo "TF_VAR_operator_ssh_public_key=$OPERATOR_SSH_PUBLIC_KEY"
          } >> "$GITHUB_ENV"
          terraform -chdir="$TERRAFORM_ROOT" init -input=false -reconfigure -backend-config="bucket=loresuelvo-terraform-state-$ENVIRONMENT" >/dev/null
      - name: Revalidate state
        id: state
        env:
          TERRAFORM_ROOT: ${{ inputs.terraform-root }}
          DESIRED_COUNT: ${{ inputs.desired-replica-count }}
          EXPECTED_COUNT: ${{ inputs.expected-current-count }}
          EXPECTED_FINGERPRINT: ${{ inputs.expected-state-fingerprint }}
        run: |
          current_count=$(terraform -chdir="$TERRAFORM_ROOT" output -raw replica_count)
          current_fingerprint=$(terraform -chdir="$TERRAFORM_ROOT" output -json | sha256sum | cut -d' ' -f1)
          mode=$(python3 scripts/provisioning/validate-replica-change.py state "$EXPECTED_COUNT" "$current_count" "$DESIRED_COUNT" "$EXPECTED_FINGERPRINT" "$current_fingerprint" '${{ github.run_attempt }}')
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Recreate approved plan
        if: steps.state.outputs.mode == 'apply'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TERRAFORM_ROOT: ${{ inputs.terraform-root }}
          DESIRED_COUNT: ${{ inputs.desired-replica-count }}
          CURRENT_COUNT: ${{ inputs.expected-current-count }}
        run: |
          terraform -chdir="$TERRAFORM_ROOT" plan -input=false -out="$RUNNER_TEMP/replicas.tfplan" -var="replica_count=$DESIRED_COUNT" >"$RUNNER_TEMP/terraform-plan.log" 2>&1
          terraform -chdir="$TERRAFORM_ROOT" show -json "$RUNNER_TEMP/replicas.tfplan" > "$RUNNER_TEMP/plan.json"
          python3 scripts/provisioning/validate-replica-change.py plan "$RUNNER_TEMP/plan.json" "$ENVIRONMENT" "$CURRENT_COUNT" "$DESIRED_COUNT" >/dev/null
      - name: Apply topology
        if: steps.state.outputs.mode == 'apply'
        env: {TERRAFORM_ROOT: "${{ inputs.terraform-root }}"}
        run: terraform -chdir="$TERRAFORM_ROOT" apply -input=false -auto-approve "$RUNNER_TEMP/replicas.tfplan" >"$RUNNER_TEMP/terraform-apply.log" 2>&1
