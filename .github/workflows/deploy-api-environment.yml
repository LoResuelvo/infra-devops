name: Deploy API environment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      config-file:
        type: string
        required: true
      image-ref:
        type: string
        required: true
      release-tag:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout deployment code
        uses: actions/checkout@v6
        with:
          repository: LoResuelvo/infra-devops
          ref: main

      - name: Prepare private secrets directory
        run: |
          mkdir -p .deployment-secrets
          chmod 0700 .deployment-secrets

      - name: Fetch deployment credentials
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /deployments
          include-imports: false
          recursive: false

      - name: Export application secrets
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /api
          include-imports: false
          recursive: false
          export-type: file
          file-output-path: /.deployment-secrets/api.env

      - name: Deploy sequentially
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          CONFIG_FILE: ${{ inputs.config-file }}
          IMAGE_REF: ${{ inputs.image-ref }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          chmod 0600 .deployment-secrets/api.env
          scripts/deploy-api.sh "$DEPLOY_ENVIRONMENT" "$DEPLOY_HOSTS" \
            "$IMAGE_REF" "$RELEASE_TAG" "$CONFIG_FILE" \
            .deployment-secrets/api.env

      - name: Remove application secrets file
        if: always()
        run: rm -f .deployment-secrets/api.env
