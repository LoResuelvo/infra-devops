name: Deploy API Environment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      config-file:
        type: string
        required: true
      image-ref:
        type: string
        required: true
      release-tag:
        type: string
        required: true

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: >-
        https://github.com/LoResuelvo/loresuelvo-api/pkgs/container/api#release_tag=${{
        inputs.release-tag }}&image_ref=${{ inputs.image-ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: LoResuelvo/infra-devops
          ref: main

      - name: Fetch Terraform credentials
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /infrastructure
          include-imports: false
          recursive: false

      - uses: ./.github/actions/setup-terraform
        with:
          environment: ${{ inputs.environment }}
          terraform-root: terraform/environments/${{ inputs.environment }}/replicas

      - name: Fetch deployment credentials
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /deployments
          include-imports: false
          recursive: false

      - name: Export API secrets
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /api
          include-imports: false
          recursive: false
          export-type: file
          file-output-path: /api.env

      - uses: ./.github/actions/setup-ansible

      - name: Generate private inventory
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          terraform -chdir="terraform/environments/$ENVIRONMENT/replicas" output -json \
            > "$RUNNER_TEMP/hosts.json"
          python3 scripts/deployment.py inventory \
            "$RUNNER_TEMP/hosts.json" \
            "$RUNNER_TEMP/inventory.json"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-key"
          chmod 0600 "$RUNNER_TEMP/deploy-key" "$GITHUB_WORKSPACE/api.env"

      - name: Deploy sequentially
        run: |
          ansible-playbook \
            -i "$RUNNER_TEMP/inventory.json" \
            --private-key "$RUNNER_TEMP/deploy-key" \
            ansible/playbooks/deploy-api.yml \
            -e environment_name='${{ inputs.environment }}' \
            -e image_ref='${{ inputs.image-ref }}' \
            -e release_tag='${{ inputs.release-tag }}' \
            -e config_file='${{ inputs.config-file }}' \
            -e secrets_file="$GITHUB_WORKSPACE/api.env" \
            -e deployment_mode=deploy

      - name: Smoke test deployed API
        run: scripts/deployment/smoke-test-api.sh '${{ inputs.environment }}'

  publish-deployment-metadata:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: LoResuelvo/infra-devops
          ref: main

      - name: Publish release metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_URL: >-
            https://github.com/LoResuelvo/loresuelvo-api/pkgs/container/api#release_tag=${{
            inputs.release-tag }}&image_ref=${{ inputs.image-ref }}
        run: python3 scripts/provisioning/publish-deployment-metadata.py
