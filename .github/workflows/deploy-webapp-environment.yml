name: Deploy Web App environment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      config-file:
        type: string
        required: true
      image-ref:
        type: string
        required: true
      release-tag:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: https://github.com/LoResuelvo/loresuelvo-webapp/pkgs/container/webapp#release_tag=${{ inputs.release-tag }}&image_ref=${{ inputs.image-ref }}
    steps:
      - name: Checkout deployment code
        uses: actions/checkout@v6
        with:
          repository: LoResuelvo/infra-devops
          ref: main

      - name: Prepare private secrets directory
        run: |
          mkdir -p .deployment-secrets
          chmod 0700 .deployment-secrets

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_wrapper: false

      - name: Fetch read-only Terraform state credentials
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /infrastructure/terraform-read
          include-imports: false
          recursive: false

      - name: Fetch deployment credentials
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /deployments
          include-imports: false
          recursive: false

      - name: Export Web App secrets
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /webapp
          include-imports: false
          recursive: false
          export-type: file
          file-output-path: .deployment-secrets/webapp.env

      - name: Deploy sequentially
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          CONFIG_FILE: ${{ inputs.config-file }}
          IMAGE_REF: ${{ inputs.image-ref }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          chmod 0600 .deployment-secrets/webapp.env
          hosts_file="$RUNNER_TEMP/deployment-hosts"
          scripts/deployment/prepare-hosts.sh "$DEPLOY_ENVIRONMENT" "$hosts_file"
          while IFS= read -r host; do echo "::add-mask::$host"; done < "$hosts_file"
          DEPLOY_HOSTS=$(<"$hosts_file")
          scripts/deployment/deploy-webapp.sh "$DEPLOY_ENVIRONMENT" "$DEPLOY_HOSTS" \
            "$IMAGE_REF" "$RELEASE_TAG" "$CONFIG_FILE" \
            .deployment-secrets/webapp.env

      - name: Remove Web App secrets file
        if: always()
        run: rm -f .deployment-secrets/webapp.env
