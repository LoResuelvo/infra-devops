name: Deploy Web App environment
on:
  workflow_call:
    inputs:
      environment: {type: string, required: true}
      config-file: {type: string, required: true}
      image-ref: {type: string, required: true}
      release-tag: {type: string, required: true}
permissions: {contents: read, id-token: write, deployments: write}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: https://github.com/LoResuelvo/loresuelvo-webapp/pkgs/container/webapp#release_tag=${{ inputs.release-tag }}&image_ref=${{ inputs.image-ref }}
    steps:
      - uses: actions/checkout@v6
        with: {repository: LoResuelvo/infra-devops, ref: main}
      - uses: hashicorp/setup-terraform@v3.1.2
        with: {terraform_version: 1.16.1, terraform_wrapper: false}
      - name: Fetch Terraform credentials
        uses: Infisical/secrets-action@v1.0.17
        with: {method: oidc, identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972, project-slug: lo-resuelvo-7j-te, env-slug: "${{ inputs.environment }}", secret-path: /infrastructure, include-imports: false, recursive: false}
      - name: Fetch deployment credentials
        uses: Infisical/secrets-action@v1.0.17
        with: {method: oidc, identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972, project-slug: lo-resuelvo-7j-te, env-slug: "${{ inputs.environment }}", secret-path: /deployments, include-imports: false, recursive: false}
      - name: Export Web App secrets
        uses: Infisical/secrets-action@v1.0.17
        with: {method: oidc, identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972, project-slug: lo-resuelvo-7j-te, env-slug: "${{ inputs.environment }}", secret-path: /webapp, include-imports: false, recursive: false, export-type: file, file-output-path: /webapp.env}
      - name: Install Ansible
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install ansible-core==2.21.3
          "$RUNNER_TEMP/ansible/bin/ansible-galaxy" collection install -r ansible/requirements.yml
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
      - name: Initialize Terraform
        env: {ENVIRONMENT: "${{ inputs.environment }}"}
        run: |
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_ENDPOINT_URL_S3="$R2_ENDPOINT"
          terraform -chdir="terraform/environments/$ENVIRONMENT/replicas" init -input=false -reconfigure -backend-config="bucket=loresuelvo-terraform-state-$ENVIRONMENT"
      - name: Generate private inventory
        env: {ENVIRONMENT: "${{ inputs.environment }}"}
        run: |
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_ENDPOINT_URL_S3="$R2_ENDPOINT"
          terraform -chdir="terraform/environments/$ENVIRONMENT/replicas" output -json > "$RUNNER_TEMP/hosts.json"
          python3 scripts/deployment.py inventory "$RUNNER_TEMP/hosts.json" "$RUNNER_TEMP/inventory.json"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-key"
          chmod 0600 "$RUNNER_TEMP/deploy-key" "$GITHUB_WORKSPACE/webapp.env"
      - name: Deploy sequentially
        run: ansible-playbook -i "$RUNNER_TEMP/inventory.json" --private-key "$RUNNER_TEMP/deploy-key" ansible/playbooks/deploy-webapp.yml -e environment_name='${{ inputs.environment }}' -e image_ref='${{ inputs.image-ref }}' -e release_tag='${{ inputs.release-tag }}' -e config_file='${{ inputs.config-file }}' -e secrets_file="$GITHUB_WORKSPACE/webapp.env"
  publish-deployment-metadata:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {repository: LoResuelvo/infra-devops, ref: main}
      - name: Publish release metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_URL: https://github.com/LoResuelvo/loresuelvo-webapp/pkgs/container/webapp#release_tag=${{ inputs.release-tag }}&image_ref=${{ inputs.image-ref }}
        run: python3 scripts/provisioning/publish-deployment-metadata.py
