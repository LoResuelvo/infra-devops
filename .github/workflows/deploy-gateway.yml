name: Deploy Gateway

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        required: true
        options:
          - staging
          - production
      image-ref:
        description: Immutable nginx image reference (nginx@sha256:...)
        type: string
        required: true
      release-tag:
        description: Nginx release
        type: string
        required: true

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-gateway-environment.yml
    with:
      environment: ${{ inputs.environment }}
      image-ref: ${{ inputs.image-ref }}
      release-tag: ${{ inputs.release-tag }}
