name: Deploy Gateway

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        required: true
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout deployment code
        uses: actions/checkout@v6

      - name: Fetch gateway deployment credentials
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /deployments
          include-imports: false
          recursive: false

      - name: Deploy and verify gateway
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: scripts/deploy-gateway.sh "$DEPLOY_ENVIRONMENT" "$DEPLOY_HOSTS"
