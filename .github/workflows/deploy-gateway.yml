name: Release Gateway

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ghcr.io/loresuelvo/gateway@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate release tag
        run: |
          python3 scripts/deployment.py tag gateway \
            '${{ github.repository }}' \
            '${{ github.ref_type }}' \
            '${{ github.ref_name }}'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish gateway
        id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/gateway
          push: true
          tags: ghcr.io/loresuelvo/gateway:${{ github.ref_name }}

  deploy-staging:
    needs: publish
    permissions:
      contents: read
      id-token: write
      deployments: write
    uses: ./.github/workflows/deploy-gateway-environment.yml
    with:
      environment: staging
      image-ref: ${{ needs.publish.outputs.image-ref }}
      release-tag: ${{ github.ref_name }}

  deploy-production:
    needs:
      - publish
      - deploy-staging
    permissions:
      contents: read
      id-token: write
      deployments: write
    uses: ./.github/workflows/deploy-gateway-environment.yml
    with:
      environment: production
      image-ref: ${{ needs.publish.outputs.image-ref }}
      release-tag: ${{ github.ref_name }}
