name: Deploy Gateway
on:
  workflow_dispatch:
    inputs:
      environment: {description: Environment to deploy, type: choice, required: true, options: [staging, production]}
      image-ref: {description: "Immutable nginx image reference (nginx@sha256:...)", type: string, required: true}
      release-tag: {description: Nginx release, type: string, required: true}
permissions: {contents: read, id-token: write, deployments: write}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: https://github.com/LoResuelvo/infra-devops/pkgs/container/gateway#release_tag=${{ inputs.release-tag }}&image_ref=${{ inputs.image-ref }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate immutable release
        run: python3 scripts/deployment.py gateway '${{ inputs.image-ref }}' '${{ inputs.release-tag }}'
      - uses: hashicorp/setup-terraform@v3.1.2
        with: {terraform_version: 1.16.1, terraform_wrapper: false}
      - name: Fetch Terraform credentials
        uses: Infisical/secrets-action@v1.0.17
        with: {method: oidc, identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972, project-slug: lo-resuelvo-7j-te, env-slug: "${{ inputs.environment }}", secret-path: /infrastructure, include-imports: false, recursive: false}
      - name: Fetch deployment credentials
        uses: Infisical/secrets-action@v1.0.17
        with: {method: oidc, identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972, project-slug: lo-resuelvo-7j-te, env-slug: "${{ inputs.environment }}", secret-path: /deployments, include-imports: false, recursive: false}
      - name: Install Ansible
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install ansible-core==2.21.3
          "$RUNNER_TEMP/ansible/bin/ansible-galaxy" collection install -r ansible/requirements.yml
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
      - name: Initialize Terraform
        env: {ENVIRONMENT: "${{ inputs.environment }}"}
        run: |
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_ENDPOINT_URL_S3="$R2_ENDPOINT"
          terraform -chdir="terraform/environments/$ENVIRONMENT/replicas" init -input=false -reconfigure -backend-config="bucket=loresuelvo-terraform-state-$ENVIRONMENT"
      - name: Generate private deployment files
        env: {ENVIRONMENT: "${{ inputs.environment }}"}
        run: |
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_ENDPOINT_URL_S3="$R2_ENDPOINT"
          terraform -chdir="terraform/environments/$ENVIRONMENT/replicas" output -json > "$RUNNER_TEMP/hosts.json"
          python3 scripts/deployment.py inventory "$RUNNER_TEMP/hosts.json" "$RUNNER_TEMP/inventory.json"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$CLOUDFLARE_ORIGIN_CERT" > "$RUNNER_TEMP/origin.crt"
          printf '%s\n' "$CLOUDFLARE_ORIGIN_KEY" > "$RUNNER_TEMP/origin.key"
          chmod 0600 "$RUNNER_TEMP/deploy-key" "$RUNNER_TEMP/origin.crt" "$RUNNER_TEMP/origin.key"
      - name: Deploy and verify gateway
        env: {ENVIRONMENT: "${{ inputs.environment }}"}
        run: |
          config=staging; [[ "$ENVIRONMENT" != production ]] || config=prod
          source "deploy/gateway/config/$config.conf"
          ansible-playbook -i "$RUNNER_TEMP/inventory.json" --private-key "$RUNNER_TEMP/deploy-key" ansible/playbooks/deploy-gateway.yml -e image_ref='${{ inputs.image-ref }}' -e release_tag='${{ inputs.release-tag }}' -e origin_cert_file="$RUNNER_TEMP/origin.crt" -e origin_key_file="$RUNNER_TEMP/origin.key" -e api_server_names="$API_SERVER_NAMES" -e web_server_names="$WEB_SERVER_NAMES" -e admin_server_names="$ADMIN_SERVER_NAMES"
  publish-deployment-metadata:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Publish release metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_URL: https://github.com/LoResuelvo/infra-devops/pkgs/container/gateway#release_tag=${{ inputs.release-tag }}&image_ref=${{ inputs.image-ref }}
        run: python3 scripts/provisioning/publish-deployment-metadata.py
