name: Deploy replicas
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      terraform-root:
        type: string
        required: true
      previous-replica-count:
        type: string
        required: true
      desired-replica-count:
        type: number
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6

      - name: Fetch infrastructure secrets
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /infrastructure
          include-imports: false
          recursive: false

      - uses: ./.github/actions/setup-terraform
        with:
          environment: ${{ inputs.environment }}
          terraform-root: ${{ inputs.terraform-root }}
  
      - name: Fetch deployment secrets
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /deployments
          include-imports: false
          recursive: false

      - name: Export API secrets
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /api
          include-imports: false
          recursive: false
          export-type: file
          file-output-path: /api.env

      - name: Export Web App secrets
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /webapp
          include-imports: false
          recursive: false
          export-type: file
          file-output-path: /webapp.env

      - uses: ./.github/actions/setup-ansible

      - name: Generate deployment inventory
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TERRAFORM_ROOT: ${{ inputs.terraform-root }}
          PREVIOUS_COUNT: ${{ inputs.previous-replica-count }}
          DESIRED_COUNT: ${{ inputs.desired-replica-count }}
        run: |
          terraform -chdir="$TERRAFORM_ROOT" output -json > "$RUNNER_TEMP/hosts.json"
          python3 scripts/deployment.py new-inventory \
            "$RUNNER_TEMP/hosts.json" \
            "$RUNNER_TEMP/inventory.json" \
            "$ENVIRONMENT" \
            "$PREVIOUS_COUNT" \
            "$DESIRED_COUNT" \
            --user deploy
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$CLOUDFLARE_ORIGIN_CERT" > "$RUNNER_TEMP/origin.crt"
          printf '%s\n' "$CLOUDFLARE_ORIGIN_KEY" > "$RUNNER_TEMP/origin.key"
          chmod 0600 \
            "$RUNNER_TEMP"/{deploy-key,origin.crt,origin.key} \
            "$GITHUB_WORKSPACE"/{api.env,webapp.env}

      - name: Download scale metadata
        uses: actions/download-artifact@v4
        with:
          name: replica-scale-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/scale-metadata

      - name: Resolve deployed releases
        id: releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/provisioning/resolve-deployed-images.py \
            '${{ inputs.environment }}' \
            "$RUNNER_TEMP/releases.env"
          source "$RUNNER_TEMP/releases.env"
          echo "gateway-tag=$GATEWAY_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          release_fingerprint=$(sha256sum "$RUNNER_TEMP/releases.env" | cut -d' ' -f1)
          expected_release_fingerprint=$(sed -n \
            's/^release-fingerprint=//p' \
            "$RUNNER_TEMP/scale-metadata/scale-metadata.env")
          [[ "$release_fingerprint" == "$expected_release_fingerprint" ]]

      - name: Checkout deployed gateway release
        if: startsWith(steps.releases.outputs.gateway-tag, 'v')
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.releases.outputs.gateway-tag }}
          path: gateway-release

      - name: Hydrate API
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          source "$RUNNER_TEMP/releases.env"
          config=staging
          [[ "$ENVIRONMENT" != production ]] || config=prod
          ansible-playbook \
            -i "$RUNNER_TEMP/inventory.json" \
            --private-key "$RUNNER_TEMP/deploy-key" \
            ansible/playbooks/deploy-api.yml \
            -e environment_name="$ENVIRONMENT" \
            -e image_ref="$API_IMAGE_REF" \
            -e release_tag="$API_RELEASE_TAG" \
            -e config_file="deploy/api/config/$config.conf" \
            -e secrets_file="$GITHUB_WORKSPACE/api.env" \
            -e deployment_mode=hydrate
      - name: Hydrate Web App

        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          source "$RUNNER_TEMP/releases.env"
          config=staging
          [[ "$ENVIRONMENT" != production ]] || config=prod
          ansible-playbook \
            -i "$RUNNER_TEMP/inventory.json" \
            --private-key "$RUNNER_TEMP/deploy-key" \
            ansible/playbooks/deploy-webapp.yml \
            -e environment_name="$ENVIRONMENT" \
            -e image_ref="$WEBAPP_IMAGE_REF" \
            -e release_tag="$WEBAPP_RELEASE_TAG" \
            -e config_file="deploy/webapp/config/$config.conf" \
            -e secrets_file="$GITHUB_WORKSPACE/webapp.env"

      - name: Deploy gateway to replicas
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          source "$RUNNER_TEMP/releases.env"
          gateway_root="$GITHUB_WORKSPACE"
          if [[ "$GATEWAY_RELEASE_TAG" == v* ]]; then
            gateway_root="$GITHUB_WORKSPACE/gateway-release"
          fi
          config=staging
          [[ "$ENVIRONMENT" != production ]] || config=prod
          # shellcheck source=/dev/null
          source "$gateway_root/deploy/gateway/config/$config.conf"
          ansible-playbook -i "$RUNNER_TEMP/inventory.json" \
            --private-key "$RUNNER_TEMP/deploy-key" \
            "$gateway_root/ansible/playbooks/deploy-gateway.yml" \
            -e image_ref="$GATEWAY_IMAGE_REF" \
            -e release_tag="$GATEWAY_RELEASE_TAG" \
            -e origin_cert_file="$RUNNER_TEMP/origin.crt" \
            -e origin_key_file="$RUNNER_TEMP/origin.key" \
            -e api_server_names="$API_SERVER_NAMES" \
            -e web_server_names="$WEB_SERVER_NAMES" \
            -e admin_server_names="$ADMIN_SERVER_NAMES" \
            -e android_app_link_package_name="$ANDROID_APP_LINK_PACKAGE_NAME" \
            -e android_app_link_sha256_cert_fingerprint="$ANDROID_APP_LINK_SHA256_CERT_FINGERPRINT"
