name: Deploy replicas
on:
  workflow_call:
    inputs:
      environment: {type: string, required: true}
      terraform-root: {type: string, required: true}
      previous-replica-count: {type: string, required: true}
      desired-replica-count: {type: number, required: true}
      release-fingerprint: {type: string, required: true}
permissions: {contents: read, id-token: write}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3.1.2
        with: {terraform_version: 1.16.1, terraform_wrapper: false}
      - name: Fetch infrastructure secrets
        uses: Infisical/secrets-action@v1.0.17
        with: {method: oidc, identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972, project-slug: lo-resuelvo-7j-te, env-slug: "${{ inputs.environment }}", secret-path: /infrastructure, include-imports: false, recursive: false}
      - name: Fetch deployment secrets
        uses: Infisical/secrets-action@v1.0.17
        with: {method: oidc, identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972, project-slug: lo-resuelvo-7j-te, env-slug: "${{ inputs.environment }}", secret-path: /deployments, include-imports: false, recursive: false}
      - name: Export API secrets
        uses: Infisical/secrets-action@v1.0.17
        with: {method: oidc, identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972, project-slug: lo-resuelvo-7j-te, env-slug: "${{ inputs.environment }}", secret-path: /api, include-imports: false, recursive: false, export-type: file, file-output-path: "${{ runner.temp }}/api.env"}
      - name: Export Web App secrets
        uses: Infisical/secrets-action@v1.0.17
        with: {method: oidc, identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972, project-slug: lo-resuelvo-7j-te, env-slug: "${{ inputs.environment }}", secret-path: /webapp, include-imports: false, recursive: false, export-type: file, file-output-path: "${{ runner.temp }}/webapp.env"}
      - name: Install Ansible
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install ansible-core==2.21.3 >/dev/null
          "$RUNNER_TEMP/ansible/bin/ansible-galaxy" collection install -r ansible/requirements.yml >/dev/null
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
      - name: Generate deployment inventory
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TERRAFORM_ROOT: ${{ inputs.terraform-root }}
          PREVIOUS_COUNT: ${{ inputs.previous-replica-count }}
          DESIRED_COUNT: ${{ inputs.desired-replica-count }}
        run: |
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_ENDPOINT_URL_S3="$R2_ENDPOINT"
          terraform -chdir="$TERRAFORM_ROOT" init -input=false -reconfigure -backend-config="bucket=loresuelvo-terraform-state-$ENVIRONMENT" >/dev/null
          terraform -chdir="$TERRAFORM_ROOT" output -json deployment_hosts > "$RUNNER_TEMP/hosts.json"
          python3 scripts/deployment.py new-inventory "$RUNNER_TEMP/hosts.json" "$RUNNER_TEMP/inventory.json" "$ENVIRONMENT" "$PREVIOUS_COUNT" "$DESIRED_COUNT" --user deploy
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$CLOUDFLARE_ORIGIN_CERT" > "$RUNNER_TEMP/origin.crt"
          printf '%s\n' "$CLOUDFLARE_ORIGIN_KEY" > "$RUNNER_TEMP/origin.key"
          chmod 0600 "$RUNNER_TEMP"/{deploy-key,origin.crt,origin.key,api.env,webapp.env}
      - name: Resolve approved releases
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: |
          python3 scripts/provisioning/resolve-deployed-images.py '${{ inputs.environment }}' "$RUNNER_TEMP/releases.env"
          [[ "$(sha256sum "$RUNNER_TEMP/releases.env" | cut -d' ' -f1)" == '${{ inputs.release-fingerprint }}' ]]
      - name: Hydrate API
        env: {ENVIRONMENT: "${{ inputs.environment }}"}
        run: |
          source "$RUNNER_TEMP/releases.env"
          config=staging; [[ "$ENVIRONMENT" != production ]] || config=prod
          ansible-playbook -i "$RUNNER_TEMP/inventory.json" --private-key "$RUNNER_TEMP/deploy-key" ansible/playbooks/deploy-api.yml -e environment_name="$ENVIRONMENT" -e image_ref="$API_IMAGE_REF" -e release_tag="$API_RELEASE_TAG" -e config_file="deploy/api/config/$config.conf" -e secrets_file="$RUNNER_TEMP/api.env" -e deployment_mode=hydrate
      - name: Hydrate Web App
        env: {ENVIRONMENT: "${{ inputs.environment }}"}
        run: |
          source "$RUNNER_TEMP/releases.env"
          config=staging; [[ "$ENVIRONMENT" != production ]] || config=prod
          ansible-playbook -i "$RUNNER_TEMP/inventory.json" --private-key "$RUNNER_TEMP/deploy-key" ansible/playbooks/deploy-webapp.yml -e environment_name="$ENVIRONMENT" -e image_ref="$WEBAPP_IMAGE_REF" -e release_tag="$WEBAPP_RELEASE_TAG" -e config_file="deploy/webapp/config/$config.conf" -e secrets_file="$RUNNER_TEMP/webapp.env"
      - name: Hydrate gateway
        env: {ENVIRONMENT: "${{ inputs.environment }}"}
        run: |
          source "$RUNNER_TEMP/releases.env"
          config=staging; [[ "$ENVIRONMENT" != production ]] || config=prod
          source "deploy/gateway/config/$config.conf"
          ansible-playbook -i "$RUNNER_TEMP/inventory.json" --private-key "$RUNNER_TEMP/deploy-key" ansible/playbooks/deploy-gateway.yml -e image_ref="$GATEWAY_IMAGE_REF" -e release_tag="$GATEWAY_RELEASE_TAG" -e origin_cert_file="$RUNNER_TEMP/origin.crt" -e origin_key_file="$RUNNER_TEMP/origin.key" -e api_server_names="$API_SERVER_NAMES" -e web_server_names="$WEB_SERVER_NAMES" -e admin_server_names="$ADMIN_SERVER_NAMES"
