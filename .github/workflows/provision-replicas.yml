name: Scale replicas

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to provision
        type: choice
        required: true
        options:
          - staging
          - production
      desired-replica-count:
        description: Total desired number of replicas
        type: number
        required: true
permissions:
  contents: read
  id-token: write
  deployments: read

concurrency:
  group: provision-replicas-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan replica change
    uses: ./.github/workflows/replica-plan.yml
    with:
      environment: ${{ inputs.environment }}
      terraform-root: terraform/environments/${{ inputs.environment }}/replicas
      desired-replica-count: ${{ fromJSON(inputs.desired-replica-count) }}
    secrets: inherit

  scale-up:
    name: Scale UP
    needs: plan
    if: needs.plan.outputs.decision == 'grow'
    uses: ./.github/workflows/scale-up.yml
    with:
      environment: ${{ inputs.environment }}
      terraform-root: terraform/environments/${{ inputs.environment }}/replicas
      desired-replica-count: ${{ fromJSON(inputs.desired-replica-count) }}
      current-replica-count: ${{ needs.plan.outputs.current-count }}
    secrets: inherit

  scale-down:
    name: Scale DOWN
    needs: plan
    if: needs.plan.outputs.decision == 'shrink'
    uses: ./.github/workflows/scale-down.yml
    with:
      environment: ${{ inputs.environment }}
      terraform-root: terraform/environments/${{ inputs.environment }}/replicas
      desired-replica-count: ${{ fromJSON(inputs.desired-replica-count) }}
      current-replica-count: ${{ needs.plan.outputs.current-count }}
    secrets: inherit
