name: Test Infisical

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-infisical:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: "cc123a18-b15c-4ac4-9027-35e66af9c972"
          project-slug: "lo-resuelvo-7j-te"
          env-slug: "test"

      - name: Verify secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL no fue cargada"
            exit 1
          fi

          echo "Infisical OIDC OK"
