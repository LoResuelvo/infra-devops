name: Test Infisical

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-infisical:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: "TU_ID_REAL"
          project-slug: "TU_SLUG_REAL"
          env-slug: "staging"

      - name: Success
        run: echo "Infisical OK"