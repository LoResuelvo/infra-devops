name: Test Infisical

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-infisical:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: "oidc"
          identity-id: "cc123a18-b15c-4ac4-9027-35e66af9c972"
          project-slug: "lo-resuelvo-7j-te"
          env-slug: "staging"
          secret-path: "/api"

      - name: Verify API secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL missing"
            exit 1
          fi

          echo "API staging secrets OK"