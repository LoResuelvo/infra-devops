name: Infrastructure CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Workflows, shell and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint workflows and embedded shell
        uses: docker://rhysd/actionlint:1.7.12

      - name: Lint shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: v5.4.0

      - name: Validate Compose files without deployment secrets
        env:
          IMAGE_REF: example.invalid/application:ci
          GATEWAY_IMAGE_REF: example.invalid/gateway:ci
        run: |
          for component in api webapp gateway; do
            docker compose -f "deploy/$component/compose.yml" config --quiet --no-env-resolution
          done

  ansible:
    name: Ansible, Python and gateway configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ansible/requirements-dev.txt

      - name: Install Ansible dependencies
        run: |
          python -m pip install -r ansible/requirements-dev.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Lint Ansible
        run: ansible-lint --offline ansible/playbooks ansible/roles

      - name: Check playbook syntax without connecting to hosts
        run: |
          for playbook in ansible/playbooks/*.yml; do
            ansible-playbook -i ansible/inventories/staging/hosts.example.yml --syntax-check "$playbook"
          done

      - name: Run existing Python tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Check existing TLS probes locally
        run: python ansible/tests/check-gateway-tls.py

      - name: Validate gateway configuration for both environments
        env:
          GATEWAY_IMAGE: loresuelvo/gateway:ci
        run: |
          docker build --tag "$GATEWAY_IMAGE" deploy/gateway
          python scripts/validation/check-gateway-config.py "$GATEWAY_IMAGE"

  terraform:
    name: Terraform (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}/replicas
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Check Terraform formatting
        working-directory: .
        run: terraform fmt -check -recursive terraform

      - name: Initialize providers without remote state
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate

      - name: Test topology with mocked providers
        run: terraform test
