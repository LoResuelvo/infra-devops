name: Plan replicas
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      terraform-root:
        type: string
        required: true
      desired-replica-count:
        type: number
        required: true
    outputs:
      current-count:
        value: ${{ jobs.plan.outputs.current-count }}
      decision:
        value: ${{ jobs.plan.outputs.decision }}

permissions:
  contents: read
  id-token: write
  deployments: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      current-count: ${{ steps.plan.outputs.current-count }}
      decision: ${{ steps.plan.outputs.decision }}
    steps:
      - uses: actions/checkout@v6

      - name: Fetch infrastructure secrets
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /infrastructure
          include-imports: false
          recursive: false

      - name: Validate inputs
        run: |
          python3 scripts/provisioning/validate-replica-change.py context \
            '${{ inputs.environment }}' \
            '${{ inputs.terraform-root }}'

      - uses: ./.github/actions/setup-terraform
        with:
          environment: ${{ inputs.environment }}
          terraform-root: ${{ inputs.terraform-root }}

      - name: Create and validate plan
        id: plan
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TERRAFORM_ROOT: ${{ inputs.terraform-root }}
          DESIRED_COUNT: ${{ inputs.desired-replica-count }}
        run: |
          state_json=$(terraform -chdir="$TERRAFORM_ROOT" output -json)
          current_count=0
          if [[ "$state_json" != '{}' ]]; then
            current_count=$(terraform -chdir="$TERRAFORM_ROOT" output -raw replica_count)
          fi
          decision=$(python3 scripts/provisioning/validate-replica-change.py count \
            "$current_count" "$DESIRED_COUNT")
          echo "current-count=$current_count" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          state_fingerprint=$(printf '%s\n' "$state_json" | sha256sum | cut -d' ' -f1)
          printf 'state-fingerprint=%s\n' "$state_fingerprint" > "$RUNNER_TEMP/scale-metadata.env"
          [[ "$decision" != unchanged ]] || exit 0
          terraform -chdir="$TERRAFORM_ROOT" plan \
            -input=false \
            -out="$RUNNER_TEMP/replicas.tfplan" \
            -var="replica_count=$DESIRED_COUNT" \
            >"$RUNNER_TEMP/terraform-plan.log" 2>&1
          terraform -chdir="$TERRAFORM_ROOT" show -json \
            "$RUNNER_TEMP/replicas.tfplan" \
            > "$RUNNER_TEMP/plan.json"
          python3 scripts/provisioning/validate-replica-change.py plan \
            "$RUNNER_TEMP/plan.json" \
            "$ENVIRONMENT" \
            "$current_count" \
            "$DESIRED_COUNT" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve deployed releases
        if: steps.plan.outputs.decision == 'grow'
        id: releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/provisioning/resolve-deployed-images.py \
            '${{ inputs.environment }}' \
            "$RUNNER_TEMP/releases.env"
          release_fingerprint=$(sha256sum "$RUNNER_TEMP/releases.env" | cut -d' ' -f1)
          printf 'release-fingerprint=%s\n' \
            "$release_fingerprint" \
            >> "$RUNNER_TEMP/scale-metadata.env"

      - name: Upload scale metadata
        if: steps.plan.outputs.decision != 'unchanged'
        uses: actions/upload-artifact@v4
        with:
          name: replica-scale-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/scale-metadata.env
          if-no-files-found: error
          overwrite: true
