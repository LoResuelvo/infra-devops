name: Provision replicas internal
on:
  workflow_call:
    inputs:
      environment: {type: string, required: true}
      terraform-root: {type: string, required: true}
      desired-replica-count: {type: number, required: true}
permissions: {contents: read, id-token: write}
concurrency:
  group: provision-replicas-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  plan:
    uses: ./.github/workflows/replica-plan.yml
    with:
      environment: ${{ inputs.environment }}
      terraform-root: ${{ inputs.terraform-root }}
      desired-replica-count: ${{ inputs.desired-replica-count }}
    secrets: inherit
  apply:
    needs: plan
    if: needs.plan.outputs.decision == 'grow'
    uses: ./.github/workflows/replica-apply.yml
    with:
      environment: ${{ inputs.environment }}
      terraform-root: ${{ inputs.terraform-root }}
      desired-replica-count: ${{ inputs.desired-replica-count }}
      expected-current-count: ${{ fromJSON(needs.plan.outputs.current-count) }}
      expected-state-fingerprint: ${{ needs.plan.outputs.state-fingerprint }}
    secrets: inherit
  configure:
    needs: [plan, apply]
    uses: ./.github/workflows/replica-configure.yml
    with:
      environment: ${{ inputs.environment }}
      terraform-root: ${{ inputs.terraform-root }}
      desired-replica-count: ${{ inputs.desired-replica-count }}
      previous-replica-count: ${{ fromJSON(needs.plan.outputs.current-count) }}
    secrets: inherit
  deploy:
    needs: [plan, configure]
    uses: ./.github/workflows/replica-deploy.yml
    with:
      environment: ${{ inputs.environment }}
      terraform-root: ${{ inputs.terraform-root }}
      desired-replica-count: ${{ inputs.desired-replica-count }}
      previous-replica-count: ${{ fromJSON(needs.plan.outputs.current-count) }}
      release-fingerprint: ${{ needs.plan.outputs.release-fingerprint }}
    secrets: inherit
  verify:
    needs: [plan, deploy]
    uses: ./.github/workflows/replica-verify.yml
    with:
      environment: ${{ inputs.environment }}
      terraform-root: ${{ inputs.terraform-root }}
      desired-replica-count: ${{ inputs.desired-replica-count }}
      previous-replica-count: ${{ fromJSON(needs.plan.outputs.current-count) }}
    secrets: inherit
