name: Provision replicas internal

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      terraform-root:
        type: string
        required: true
      desired-replica-count:
        type: number
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: provision-replicas-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate-and-plan:
    runs-on: ubuntu-latest
    outputs:
      current-count: ${{ steps.plan.outputs.current-count }}
      decision: ${{ steps.plan.outputs.decision }}
      state-fingerprint: ${{ steps.plan.outputs.state-fingerprint }}
      release-fingerprint: ${{ steps.releases.outputs.release-fingerprint }}
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v6

      - name: Validate controlled inputs
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TERRAFORM_ROOT: ${{ inputs.terraform-root }}
        run: |
          python3 scripts/provisioning/validate-replica-change.py context \
            "$ENVIRONMENT" "$TERRAFORM_ROOT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_wrapper: false

      - name: Fetch Terraform write credentials
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /infrastructure/terraform-write
          include-imports: false
          recursive: false

      - name: Fetch individual OpenStack credentials
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /infrastructure/openstack
          include-imports: false
          recursive: false

      - name: Fetch provisioning SSH keys
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /infrastructure/ssh
          include-imports: false
          recursive: false

      - name: Initialize remote state and variables
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TERRAFORM_ROOT: ${{ inputs.terraform-root }}
          PRIMARY_NAME: ${{ inputs.environment == 'production' && vars.PRODUCTION_TF_PRIMARY_INSTANCE_NAME || vars.STAGING_TF_PRIMARY_INSTANCE_NAME }}
          PRIMARY_IPV4: ${{ inputs.environment == 'production' && vars.PRODUCTION_TF_PRIMARY_INSTANCE_IPV4 || vars.STAGING_TF_PRIMARY_INSTANCE_IPV4 }}
          REGION: ${{ inputs.environment == 'production' && vars.PRODUCTION_TF_REGION || vars.STAGING_TF_REGION }}
          IMAGE_NAME: ${{ inputs.environment == 'production' && vars.PRODUCTION_TF_IMAGE_NAME || vars.STAGING_TF_IMAGE_NAME }}
          FLAVOR_NAME: ${{ inputs.environment == 'production' && vars.PRODUCTION_TF_FLAVOR_NAME || vars.STAGING_TF_FLAVOR_NAME }}
          PUBLIC_NETWORK_ID: ${{ inputs.environment == 'production' && vars.PRODUCTION_TF_PUBLIC_NETWORK_ID || vars.STAGING_TF_PUBLIC_NETWORK_ID }}
        run: |
          : "${R2_ACCESS_KEY_ID:?}" "${R2_SECRET_ACCESS_KEY:?}" "${R2_ENDPOINT:?}"
          : "${OPERATOR_SSH_PUBLIC_KEY:?}"
          : "${PRIMARY_NAME:?}" "${PRIMARY_IPV4:?}" "${REGION:?}" "${IMAGE_NAME:?}" "${FLAVOR_NAME:?}" "${PUBLIC_NETWORK_ID:?}"
          echo "::add-mask::$PRIMARY_IPV4"
          {
            echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY"
            echo "AWS_ENDPOINT_URL_S3=$R2_ENDPOINT"
            echo "TF_VAR_environment=$ENVIRONMENT"
            echo "TF_VAR_primary_instance={\"name\":\"$PRIMARY_NAME\",\"ipv4\":\"$PRIMARY_IPV4\"}"
            echo "TF_VAR_region=$REGION"
            echo "TF_VAR_image_name=$IMAGE_NAME"
            echo "TF_VAR_flavor_name=$FLAVOR_NAME"
            echo "TF_VAR_public_network_id=$PUBLIC_NETWORK_ID"
            echo "TF_VAR_operator_ssh_public_key=$OPERATOR_SSH_PUBLIC_KEY"
          } >> "$GITHUB_ENV"
          terraform -chdir="$TERRAFORM_ROOT" init -input=false -reconfigure \
            -backend-config="bucket=loresuelvo-terraform-state-$ENVIRONMENT" >/dev/null

      - name: Validate desired count and plan
        id: plan
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TERRAFORM_ROOT: ${{ inputs.terraform-root }}
          DESIRED_COUNT: ${{ inputs.desired-replica-count }}
        run: |
          current_count=$(terraform -chdir="$TERRAFORM_ROOT" output -raw replica_count)
          decision=$(python3 scripts/provisioning/validate-replica-change.py count "$current_count" "$DESIRED_COUNT")
          state_fingerprint=$(terraform -chdir="$TERRAFORM_ROOT" output -json | sha256sum | cut -d' ' -f1)
          echo "current-count=$current_count" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "state-fingerprint=$state_fingerprint" >> "$GITHUB_OUTPUT"
          if [[ "$decision" == unchanged ]]; then
            echo "No infrastructure changes are required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          plan_file="$RUNNER_TEMP/replicas.tfplan"
          plan_json="$RUNNER_TEMP/replicas-plan.json"
          if ! terraform -chdir="$TERRAFORM_ROOT" plan -input=false -out="$plan_file" \
            -var="replica_count=$DESIRED_COUNT" >"$RUNNER_TEMP/terraform-plan.log" 2>&1; then
            echo "Terraform could not create a plan; detailed output was kept private on the runner." >&2
            exit 1
          fi
          terraform -chdir="$TERRAFORM_ROOT" show -json "$plan_file" > "$plan_json"
          python3 scripts/provisioning/validate-replica-change.py plan "$plan_json" \
            "$ENVIRONMENT" "$current_count" "$DESIRED_COUNT" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve successful deployed releases
        if: steps.plan.outputs.decision == 'grow'
        id: releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          releases_file="$RUNNER_TEMP/deployed-releases.env"
          python3 scripts/provisioning/resolve-deployed-images.py \
            "${{ inputs.environment }}" "$releases_file"
          echo "release-fingerprint=$(sha256sum "$releases_file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  apply-configure-deploy:
    needs: validate-and-plan
    if: needs.validate-and-plan.outputs.decision == 'grow'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'production' && 'production-infrastructure' || 'staging' }}
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_wrapper: false

      - name: Fetch Terraform write credentials
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /infrastructure/terraform-write
          include-imports: false
          recursive: false

      - name: Fetch individual OpenStack credentials
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /infrastructure/openstack
          include-imports: false
          recursive: false

      - name: Fetch SSH and deployment credentials
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /infrastructure/ssh
          include-imports: false
          recursive: false

      - name: Fetch container and gateway credentials
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /deployments
          include-imports: false
          recursive: false

      - name: Export API secrets
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /api
          include-imports: false
          recursive: false
          export-type: file
          file-output-path: ${{ runner.temp }}/api.env

      - name: Export Web App secrets
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /webapp
          include-imports: false
          recursive: false
          export-type: file
          file-output-path: ${{ runner.temp }}/webapp.env

      - name: Install pinned Ansible dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/pip" install --disable-pip-version-check \
            -r ansible/requirements-dev.txt >/dev/null
          "$RUNNER_TEMP/ansible-venv/bin/ansible-galaxy" collection install \
            -r ansible/requirements.yml >/dev/null
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Recheck state, apply, configure, and deploy new nodes
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TERRAFORM_ROOT: ${{ inputs.terraform-root }}
          DESIRED_COUNT: ${{ inputs.desired-replica-count }}
          EXPECTED_CURRENT_COUNT: ${{ needs.validate-and-plan.outputs.current-count }}
          EXPECTED_STATE_FINGERPRINT: ${{ needs.validate-and-plan.outputs.state-fingerprint }}
          EXPECTED_RELEASE_FINGERPRINT: ${{ needs.validate-and-plan.outputs.release-fingerprint }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_TOKEN: ${{ github.token }}
          PRIMARY_NAME: ${{ inputs.environment == 'production' && vars.PRODUCTION_TF_PRIMARY_INSTANCE_NAME || vars.STAGING_TF_PRIMARY_INSTANCE_NAME }}
          PRIMARY_IPV4: ${{ inputs.environment == 'production' && vars.PRODUCTION_TF_PRIMARY_INSTANCE_IPV4 || vars.STAGING_TF_PRIMARY_INSTANCE_IPV4 }}
          REGION: ${{ inputs.environment == 'production' && vars.PRODUCTION_TF_REGION || vars.STAGING_TF_REGION }}
          IMAGE_NAME: ${{ inputs.environment == 'production' && vars.PRODUCTION_TF_IMAGE_NAME || vars.STAGING_TF_IMAGE_NAME }}
          FLAVOR_NAME: ${{ inputs.environment == 'production' && vars.PRODUCTION_TF_FLAVOR_NAME || vars.STAGING_TF_FLAVOR_NAME }}
          PUBLIC_NETWORK_ID: ${{ inputs.environment == 'production' && vars.PRODUCTION_TF_PUBLIC_NETWORK_ID || vars.STAGING_TF_PUBLIC_NETWORK_ID }}
        run: |
          set -euo pipefail
          : "${R2_ACCESS_KEY_ID:?}" "${R2_SECRET_ACCESS_KEY:?}" "${R2_ENDPOINT:?}"
          : "${OPERATOR_SSH_PUBLIC_KEY:?}" "${OPERATOR_SSH_PRIVATE_KEY:?}"
          export AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
          export AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
          export AWS_ENDPOINT_URL_S3=$R2_ENDPOINT
          export TF_VAR_environment=$ENVIRONMENT
          export TF_VAR_primary_instance="{\"name\":\"$PRIMARY_NAME\",\"ipv4\":\"$PRIMARY_IPV4\"}"
          export TF_VAR_region=$REGION TF_VAR_image_name=$IMAGE_NAME
          export TF_VAR_flavor_name=$FLAVOR_NAME TF_VAR_public_network_id=$PUBLIC_NETWORK_ID
          export TF_VAR_operator_ssh_public_key=$OPERATOR_SSH_PUBLIC_KEY
          echo "::add-mask::$PRIMARY_IPV4"
          terraform -chdir="$TERRAFORM_ROOT" init -input=false -reconfigure \
            -backend-config="bucket=loresuelvo-terraform-state-$ENVIRONMENT" >/dev/null

          current_count=$(terraform -chdir="$TERRAFORM_ROOT" output -raw replica_count)
          current_fingerprint=$(terraform -chdir="$TERRAFORM_ROOT" output -json | sha256sum | cut -d' ' -f1)
          execution_mode=$(python3 scripts/provisioning/validate-replica-change.py state \
            "$EXPECTED_CURRENT_COUNT" "$current_count" "$DESIRED_COUNT" \
            "$EXPECTED_STATE_FINGERPRINT" "$current_fingerprint" "$RUN_ATTEMPT")
          python3 scripts/provisioning/resolve-deployed-images.py \
            "$ENVIRONMENT" "$RUNNER_TEMP/deployed-releases.env"
          release_fingerprint=$(sha256sum "$RUNNER_TEMP/deployed-releases.env" | cut -d' ' -f1)
          [[ "$release_fingerprint" == "$EXPECTED_RELEASE_FINGERPRINT" ]]
          if [[ "$execution_mode" == apply ]]; then
            terraform -chdir="$TERRAFORM_ROOT" output -json replica_names > "$RUNNER_TEMP/before-names.json"
          else
            python3 - "$ENVIRONMENT" "$EXPECTED_CURRENT_COUNT" "$RUNNER_TEMP/before-names.json" <<'PY'
          import json, sys
          environment, count, destination = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          names = [f"{environment}-replica-{index:02d}" for index in range(1, count + 1)]
          with open(destination, "w", encoding="utf-8") as stream:
              json.dump(names, stream)
          PY
          fi

          if [[ "$execution_mode" == apply ]]; then
            python3 scripts/provisioning/validate-replica-change.py count "$current_count" "$DESIRED_COUNT" >/dev/null
            plan_file="$RUNNER_TEMP/replicas.tfplan"
            plan_json="$RUNNER_TEMP/replicas-plan.json"
            if ! terraform -chdir="$TERRAFORM_ROOT" plan -input=false -out="$plan_file" \
              -var="replica_count=$DESIRED_COUNT" >"$RUNNER_TEMP/terraform-plan.log" 2>&1; then
              echo "Terraform could not recreate the approved plan; detailed output was kept private on the runner." >&2
              exit 1
            fi
            terraform -chdir="$TERRAFORM_ROOT" show -json "$plan_file" > "$plan_json"
            python3 scripts/provisioning/validate-replica-change.py plan "$plan_json" \
              "$ENVIRONMENT" "$current_count" "$DESIRED_COUNT" >/dev/null
            if ! terraform -chdir="$TERRAFORM_ROOT" apply -input=false -auto-approve "$plan_file" \
              >"$RUNNER_TEMP/terraform-apply.log" 2>&1; then
              echo "Terraform apply failed; detailed output was kept private on the runner." >&2
              exit 1
            fi
          fi

          terraform -chdir="$TERRAFORM_ROOT" output -json deployment_hosts > "$RUNNER_TEMP/after-hosts.json"
          python3 - "$RUNNER_TEMP/before-names.json" "$RUNNER_TEMP/after-hosts.json" \
            "$RUNNER_TEMP/new-nodes.json" "$ENVIRONMENT" "$EXPECTED_CURRENT_COUNT" "$DESIRED_COUNT" <<'PY'
          import json, sys
          before = set(json.load(open(sys.argv[1], encoding="utf-8")))
          hosts = json.load(open(sys.argv[2], encoding="utf-8"))
          new = [{"name": host["name"], "ipv4": host["ipv4"]} for host in hosts if host["role"] == "replica" and host["name"] not in before]
          expected = {f"{sys.argv[4]}-replica-{index:02d}" for index in range(int(sys.argv[5]) + 1, int(sys.argv[6]) + 1)}
          if {node["name"] for node in new} != expected:
              raise SystemExit("Terraform outputs do not contain exactly the expected new replicas")
          with open(sys.argv[3], "w", encoding="utf-8") as stream:
              json.dump(new, stream)
          PY
          chmod 0600 "$RUNNER_TEMP/new-nodes.json" "$RUNNER_TEMP/api.env" "$RUNNER_TEMP/webapp.env"
          python3 -c 'import json,sys; [print(x["ipv4"]) for x in json.load(open(sys.argv[1]))]' \
            "$RUNNER_TEMP/new-nodes.json" > "$RUNNER_TEMP/new-hosts"
          while IFS= read -r host; do echo "::add-mask::$host"; done < "$RUNNER_TEMP/new-hosts"

          new_nodes=$(<"$RUNNER_TEMP/new-nodes.json")
          new_hosts=$(<"$RUNNER_TEMP/new-hosts")
          scripts/provisioning/configure-new-replicas.sh "$ENVIRONMENT" "$new_nodes"
          source "$RUNNER_TEMP/deployed-releases.env"
          config_name=staging
          [[ "$ENVIRONMENT" != production ]] || config_name=prod
          scripts/deployment/deploy-api.sh "$ENVIRONMENT" "$new_hosts" \
            "$API_IMAGE_REF" "$API_RELEASE_TAG" "deploy/api/config/$config_name.conf" \
            "$RUNNER_TEMP/api.env" hydrate
          scripts/deployment/deploy-webapp.sh "$ENVIRONMENT" "$new_hosts" \
            "$WEBAPP_IMAGE_REF" "$WEBAPP_RELEASE_TAG" "deploy/webapp/config/$config_name.conf" \
            "$RUNNER_TEMP/webapp.env"
          scripts/deployment/deploy-gateway.sh "$ENVIRONMENT" "$new_hosts" \
            "$GATEWAY_IMAGE_REF" "$GATEWAY_RELEASE_TAG"
          scripts/deployment/verify-nodes.sh "$ENVIRONMENT" "$new_hosts"
