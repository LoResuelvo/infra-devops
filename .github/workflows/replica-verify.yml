name: Verify replicas

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      terraform-root:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch infrastructure secrets
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /infrastructure
          include-imports: false
          recursive: false

      - uses: ./.github/actions/setup-terraform
        with:
          environment: ${{ inputs.environment }}
          terraform-root: ${{ inputs.terraform-root }}

      - name: Fetch deployment secrets
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /deployments
          include-imports: false
          recursive: false

      - uses: ./.github/actions/setup-ansible

      - name: Generate verification inventory
        env:
          TERRAFORM_ROOT: ${{ inputs.terraform-root }}
        run: |
          terraform -chdir="$TERRAFORM_ROOT" output -json > "$RUNNER_TEMP/hosts.json"
          python3 scripts/deployment.py inventory \
            "$RUNNER_TEMP/hosts.json" \
            "$RUNNER_TEMP/inventory.json" \
            --user deploy
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-key"
          chmod 0600 "$RUNNER_TEMP/deploy-key"

      - name: Verify applications
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          config=staging
          [[ "$ENVIRONMENT" != production ]] || config=prod
          # shellcheck source=/dev/null
          source "deploy/gateway/config/$config.conf"
          ansible-playbook \
            -i "$RUNNER_TEMP/inventory.json" \
            --private-key "$RUNNER_TEMP/deploy-key" \
            ansible/playbooks/verify-deployment.yml \
            -e api_server_name="$API_SERVER_NAMES" \
            -e web_server_name="${WEB_SERVER_NAMES%% *}"
