name: Verify replicas
on:
  workflow_call:
    inputs:
      environment: {type: string, required: true}
      terraform-root: {type: string, required: true}
permissions: {contents: read, id-token: write}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3.1.2
        with: {terraform_version: 1.16.1, terraform_wrapper: false}
      - name: Fetch infrastructure secrets
        uses: Infisical/secrets-action@v1.0.17
        with: {method: oidc, identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972, project-slug: lo-resuelvo-7j-te, env-slug: "${{ inputs.environment }}", secret-path: /infrastructure, include-imports: false, recursive: false}
      - name: Fetch deployment secrets
        uses: Infisical/secrets-action@v1.0.17
        with: {method: oidc, identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972, project-slug: lo-resuelvo-7j-te, env-slug: "${{ inputs.environment }}", secret-path: /deployments, include-imports: false, recursive: false}
      - name: Install Ansible
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install ansible-core==2.21.3 >/dev/null
          "$RUNNER_TEMP/ansible/bin/ansible-galaxy" collection install -r ansible/requirements.yml >/dev/null
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
      - name: Generate verification inventory
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TERRAFORM_ROOT: ${{ inputs.terraform-root }}
        run: |
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_ENDPOINT_URL_S3="$R2_ENDPOINT"
          terraform -chdir="$TERRAFORM_ROOT" init -input=false -reconfigure -backend-config="bucket=loresuelvo-terraform-state-$ENVIRONMENT" >/dev/null
          terraform -chdir="$TERRAFORM_ROOT" output -json deployment_hosts > "$RUNNER_TEMP/hosts.json"
          python3 scripts/deployment.py inventory "$RUNNER_TEMP/hosts.json" "$RUNNER_TEMP/inventory.json" --user deploy
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-key"
          chmod 0600 "$RUNNER_TEMP/deploy-key"
      - name: Verify applications
        env: {ENVIRONMENT: "${{ inputs.environment }}"}
        run: |
          config=staging; [[ "$ENVIRONMENT" != production ]] || config=prod
          source "deploy/gateway/config/$config.conf"
          ansible-playbook -i "$RUNNER_TEMP/inventory.json" --private-key "$RUNNER_TEMP/deploy-key" ansible/playbooks/verify-deployment.yml -e api_server_name="$API_SERVER_NAMES" -e web_server_name="${WEB_SERVER_NAMES%% *}"
