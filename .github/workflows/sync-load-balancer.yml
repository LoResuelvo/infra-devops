name: Sync Cloudflare pool

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      replicas-terraform-root:
        type: string
        required: true
      active-replica-count:
        type: number
        required: true
      mode:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudflare-pool-${{ inputs.environment }}
  cancel-in-progress: false

env:
  DRAIN_SECONDS: 60

jobs:
  sync:
    name: ${{ inputs.mode }} Cloudflare endpoints
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'production' && 'production-infrastructure' || 'staging' }}

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Fetch infrastructure secrets
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: cc123a18-b15c-4ac4-9027-35e66af9c972
          project-slug: lo-resuelvo-7j-te
          env-slug: ${{ inputs.environment }}
          secret-path: /infrastructure
          include-imports: false
          recursive: false

      - name: Read replicas and Cloudflare pool
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REPLICAS_ROOT: ${{ inputs.replicas-terraform-root }}
        run: |
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
                 AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
                 AWS_ENDPOINT_URL_S3="$R2_ENDPOINT"

          terraform -chdir="$REPLICAS_ROOT" init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=loresuelvo-terraform-state-$ENVIRONMENT" >/dev/null
          terraform -chdir="$REPLICAS_ROOT" output -json > "$RUNNER_TEMP/replicas.json"

          curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/load_balancers/pools/$CLOUDFLARE_POOL_ID" \
            > "$RUNNER_TEMP/pool.json"

      - name: Update managed endpoints
        env:
          ACTIVE_REPLICAS: ${{ inputs.active-replica-count }}
          ENVIRONMENT: ${{ inputs.environment }}
          MODE: ${{ inputs.mode }}
        run: |
          python3 scripts/deployment.py cloudflare-origins \
            "$RUNNER_TEMP/pool.json" \
            "$RUNNER_TEMP/replicas.json" \
            "$RUNNER_TEMP/origins.json" \
            "$ENVIRONMENT" \
            "$ACTIVE_REPLICAS" \
            "$MODE"

          curl --silent --show-error --fail-with-body \
            --request PATCH \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/origins.json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/load_balancers/pools/$CLOUDFLARE_POOL_ID" \
            | jq -e '.success' >/dev/null

      - name: Confirm disabled endpoints and drain
        if: inputs.mode == 'drain'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          for attempt in {1..12}; do
            response=$(curl --silent --show-error --fail-with-body \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/load_balancers/pools/$CLOUDFLARE_POOL_ID")

            if jq -e --arg environment "$ENVIRONMENT" '
              [.result.origins[] |
                select(
                  (.name | test("^" + $environment + "-replica-[0-9]{2}$")) and
                  .enabled == false
                )
              ] as $disabled |
              ($disabled | length) > 0 and
              all($disabled[]; (.disabled_at // "") != "")
            ' <<<"$response" >/dev/null; then
              sleep "$DRAIN_SECONDS"
              exit 0
            fi

            sleep 5
          done

          echo "Cloudflare did not confirm disabled endpoints" >&2
          exit 1

      - name: Wait for enabled replicas to become healthy
        if: inputs.mode == 'activate'
        env:
          ACTIVE_REPLICAS: ${{ inputs.active-replica-count }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          for attempt in {1..30}; do
            response=$(curl --silent --show-error --fail-with-body \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/load_balancers/pools/$CLOUDFLARE_POOL_ID")

            if jq -e --arg environment "$ENVIRONMENT" --argjson expected "$ACTIVE_REPLICAS" '
              [.result.origins[] |
                select(
                  (.name | test("^" + $environment + "-replica-[0-9]{2}$")) and
                  .enabled == true
                )
              ] as $replicas |
              ($replicas | length) == $expected and
              all($replicas[]; .healthy == true)
            ' <<<"$response" >/dev/null; then
              exit 0
            fi

            sleep 10
          done

          echo "Enabled Cloudflare replicas did not become healthy" >&2
          exit 1
