proxy_buffer_size          128k;
proxy_buffers              4 256k;
proxy_busy_buffers_size    256k;

resolver 127.0.0.11 valid=10s ipv6=off;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

server {
    listen 80;

    server_name api.loresuelvo.com.ar api-test.loresuelvo.com.ar;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;

    server_name loresuelvo.com.ar www.loresuelvo.com.ar test.loresuelvo.com.ar;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;

    server_name gestion.loresuelvo.com.ar gestion-test.loresuelvo.com.ar;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;

    server_name api.loresuelvo.com.ar;

    ssl_certificate /etc/loresuelvo/gateway/tls/origin.crt;
    ssl_certificate_key /etc/loresuelvo/gateway/tls/origin.key;

    location /ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
    }
}

