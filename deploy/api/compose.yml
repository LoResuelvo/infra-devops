services:
  api:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    env_file:
      - /etc/loresuelvo/api/api.env
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    networks:
      - app-network

  migrate:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    profiles:
      - tools
    env_file:
      - /etc/loresuelvo/api/api.env
    entrypoint: ["/bin/sh", "-ec"]
    command: ['exec /usr/local/bin/migrate -path /migrations -database "$$DATABASE_URL" up']
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    external: true
