---
loresuelvo_bootstrap_version: "2026-09-04.1"
loresuelvo_configuration_version: "2026-09-07.2"

docker_apt_versions:
  docker-ce: "5:29.7.2-1~ubuntu.24.04~noble"
  docker-ce-cli: "5:29.7.2-1~ubuntu.24.04~noble"
  containerd.io: "2.3.3-1~ubuntu.24.04~noble"
  docker-buildx-plugin: "0.36.1-1~ubuntu.24.04~noble"
  docker-compose-plugin: "5.4.0-1~ubuntu.24.04~noble"

docker_daemon_options:
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "5"
  live-restore: true

application_root_directories:
  - /opt/loresuelvo
  - /etc/loresuelvo

application_deploy_directory_owner: deploy
application_deploy_directory_group: deploy
application_deploy_directories:
  - path: /opt/loresuelvo/api
    mode: "0750"
  - path: /opt/loresuelvo/gateway
    mode: "0750"
  - path: /opt/loresuelvo/gateway/nginx
    mode: "0750"
  - path: /opt/loresuelvo/webapp
    mode: "0750"
  - path: /etc/loresuelvo/api
    mode: "0700"
  - path: /etc/loresuelvo/gateway/tls
    mode: "0700"
  - path: /etc/loresuelvo/webapp
    mode: "0700"

application_ingress_tcp_ports:
  - 22
  - 80
  - 443
