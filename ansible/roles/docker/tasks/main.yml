---
- name: Map architecture for Docker repository
  ansible.builtin.set_fact:
    docker_apt_architecture: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure Docker APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_architecture }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Install pinned Docker packages
  ansible.builtin.apt:
    name: "{{ docker_apt_versions | dict2items | map('join', '=') | list }}"
    state: present
    allow_downgrade: true
  notify: Restart Docker

- name: Hold Docker package versions
  ansible.builtin.dpkg_selections:
    name: "{{ item.key }}"
    selection: hold
  loop: "{{ docker_apt_versions | dict2items }}"

- name: Configure Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: "{{ docker_daemon_options | to_nice_json }}\n"
  notify: Restart Docker

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Apply pending Docker restarts before network creation
  ansible.builtin.meta: flush_handlers

- name: Create shared application network
  community.docker.docker_network:
    name: app-network
    state: present
