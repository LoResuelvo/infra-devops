---
- name: Map architecture for Docker repository
  ansible.builtin.set_fact:
    docker_apt_architecture: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"

- name: Configure Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - https://download.docker.com/linux/ubuntu
    suites:
      - "{{ ansible_facts.distribution_release }}"
    components:
      - stable
    architectures:
      - "{{ docker_apt_architecture }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    install_python_debian: true
    state: present
  register: docker_repository

- name: Update APT cache for Docker repository
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ 0 if docker_repository.changed else 3600 }}"

- name: Install pinned Docker packages
  ansible.builtin.apt:
    name: "{{ item.key }}={{ item.value }}"
    state: present
    allow_downgrade: true
  loop: "{{ docker_apt_versions | dict2items }}"
  notify: Restart Docker

- name: Hold Docker package versions
  ansible.builtin.dpkg_selections:
    name: "{{ item.key }}"
    selection: hold
  loop: "{{ docker_apt_versions | dict2items }}"

- name: Configure Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: "{{ docker_daemon_options | to_nice_json }}\n"
  notify: Restart Docker

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Apply pending Docker restarts before network creation
  ansible.builtin.meta: flush_handlers

- name: Create shared application network
  community.docker.docker_network:
    name: app-network
    state: present
