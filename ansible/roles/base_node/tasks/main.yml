---
- name: Install base node packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3
      - sudo
      - unattended-upgrades
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create LoResuelvo root directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ application_root_directories }}"

- name: Configure unattended security updates without automatic reboot
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52loresuelvo-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Enable unattended upgrades
  ansible.builtin.service:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Write node configuration marker
  ansible.builtin.copy:
    dest: /etc/loresuelvo/configuration-version
    owner: root
    group: root
    mode: "0644"
    content: "{{ loresuelvo_configuration_version }}\n"
