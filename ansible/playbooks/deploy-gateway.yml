---
- name: Deploy gateway sequentially
  hosts: application_nodes
  serial: 1
  gather_facts: false
  pre_tasks:
    - name: Validate gateway deployment
      ansible.builtin.assert:
        that:
          - image_ref is match('^nginx@sha256:[a-f0-9]{64}$')
          - release_tag is match('^[0-9]+\\.[0-9]+\\.[0-9]+(-alpine)?$')
          - api_server_names is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
          - web_server_names is match('^[A-Za-z0-9][A-Za-z0-9 .-]*$')
          - admin_server_names is match('^[A-Za-z0-9][A-Za-z0-9 .-]*$')
  tasks:
    - name: Install gateway files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - {src: "{{ playbook_dir }}/../../deploy/gateway/compose.yml", dest: /opt/loresuelvo/gateway/compose.yml, mode: "0640"}
        - {src: "{{ origin_cert_file }}", dest: /etc/loresuelvo/gateway/tls/origin.crt, mode: "0640"}
        - {src: "{{ origin_key_file }}", dest: /etc/loresuelvo/gateway/tls/origin.key, mode: "0600"}
      no_log: true
    - name: Render nginx configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../deploy/gateway/nginx/default.conf.template"
        dest: /opt/loresuelvo/gateway/nginx/default.conf
        mode: "0640"
    - name: Start gateway
      community.docker.docker_compose_v2:
        project_src: /opt/loresuelvo/gateway
        pull: always
        services: [gateway]
        state: present
      environment:
        GATEWAY_IMAGE_REF: "{{ image_ref }}"
    - name: Wait for gateway readiness
      ansible.builtin.uri:
        url: https://127.0.0.1/__gateway_ready
        validate_certs: false
        status_code: 404
        headers:
          Host: "{{ api_server_names }}"
      register: gateway_health
      retries: 30
      delay: 2
      until: gateway_health.status == 404
    - name: Record gateway release
      ansible.builtin.copy:
        dest: /opt/loresuelvo/gateway/CURRENT_RELEASE
        mode: "0640"
        content: "RELEASE_TAG={{ release_tag }}\nIMAGE_REF={{ image_ref }}\n"
