---
- name: Configure LoResuelvo application nodes
  hosts: application_nodes
  become: true
  gather_facts: false

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Wait for cloud-init
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init_wait
      changed_when: false
      failed_when: >-
        not (cloud_init_wait.unreachable | default(false))
        and cloud_init_wait.rc != 0
      ignore_unreachable: true

    - name: Reconnect after possible cloud-init reboot
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Confirm cloud-init completed
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Gather facts after SSH and cloud-init are ready
      ansible.builtin.setup:

    - name: Require Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
          - ansible_facts.distribution_version is version('24.04', '==')
        fail_msg: This playbook supports Ubuntu 24.04 only.

    - name: Require deployment public keys
      ansible.builtin.assert:
        that:
          - deploy_ssh_public_keys is defined
          - deploy_ssh_public_keys | length > 0
          - deploy_ssh_public_keys | select('match', '^(ssh-(rsa|ed25519)|ecdsa-sha2-nistp(256|384|521)) ') | list | length == deploy_ssh_public_keys | length
        fail_msg: Set at least one valid deploy_ssh_public_keys entry.

  roles:
    - role: base_node
    - role: docker
    - role: deploy_user
    - role: firewall

  post_tasks:
    - name: Write node configuration marker
      ansible.builtin.copy:
        dest: /etc/loresuelvo/configuration-version
        owner: root
        group: root
        mode: "0644"
        content: "{{ loresuelvo_configuration_version }}\n"
