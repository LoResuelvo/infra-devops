---
- name: Verify deployed applications
  hosts: application_nodes
  gather_facts: false
  tasks:
    - name: Check API readiness
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/health/ready
    - name: Check Web App through gateway
      ansible.builtin.uri:
        url: "https://127.0.0.1/"
        headers: {Host: "{{ web_server_name }}"}
        validate_certs: false
    - name: Check gateway API route
      ansible.builtin.uri:
        url: "https://127.0.0.1/__gateway_ready"
        headers: {Host: "{{ api_server_name }}"}
        validate_certs: false
        status_code: 404
