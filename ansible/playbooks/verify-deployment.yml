---
- name: Verify deployed applications
  hosts: application_nodes
  gather_facts: false
  tasks:
    - name: Check API readiness
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/health/ready
    - name: Check HTTPS routes with the correct TLS server name
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --insecure
          - --noproxy
          - '*'
          - --max-time
          - '10'
          - --resolve
          - "{{ item.host }}:443:127.0.0.1"
          - --output
          - /dev/null
          - --write-out
          - '%{http_code}'
          - "https://{{ item.host }}{{ item.path }}"
      loop:
        - {host: "{{ web_server_name }}", path: /, status: '200'}
        - {host: "{{ api_server_name }}", path: /__gateway_ready, status: '200'}
      changed_when: false
      register: route_health
      failed_when: route_health.rc != 0 or route_health.stdout != item.status
